app-id: com.moscatee.Editor
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20

command: moscatee

separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  # Accessibility / TTS: lets Chromium's Web Speech API reach the host's
  # speech-dispatcher daemon (used by the blind/low-vision mode).
  - --socket=session-bus
  - --talk-name=org.freedesktop.speechd
  - --filesystem=xdg-run/speech-dispatcher

build-options:
  append-path: /usr/lib/sdk/node20/bin
  build-args:
    - --share=network
  env:
    npm_config_nodedir: /usr/lib/sdk/node20
    npm_config_cache: /run/build/moscatee/flatpak-node/npm-cache

modules:
  - name: moscatee
    buildsystem: simple
    sources:
      - type: dir
        path: ../
      - type: script
        dest-filename: moscatee.sh
        commands:
          - exec zypak-wrapper.sh /app/main/node_modules/electron/dist/electron /app/main/main.cjs "$@"
    build-commands:
      # Install npm deps with network.
      - npm install --ignore-scripts
      # Unpack the cached Electron binary into node_modules/electron/dist
      - mkdir -p node_modules/electron/dist
      - cd node_modules/electron/dist && unzip -q /run/build/moscatee/flatpak-node/cache/electron/electron-v32.3.3-linux-x64.zip
      - chmod +x node_modules/electron/dist/electron
      - echo "electron" > node_modules/electron/path.txt
      # Build the renderer (Vite).
      - npm run build:electron
      # Install the app
      - mkdir -p /app/main
      - cp -a dist-web main.cjs preload.cjs package.json node_modules /app/main/
      - install -Dm755 moscatee.sh /app/bin/moscatee
      - install -Dm644 flatpak/com.moscatee.Editor.desktop /app/share/applications/com.moscatee.Editor.desktop
      - install -Dm644 flatpak/com.moscatee.Editor.metainfo.xml /app/share/metainfo/com.moscatee.Editor.metainfo.xml
      - install -Dm644 flatpak/icons/com.moscatee.Editor-48x48.png /app/share/icons/hicolor/48x48/apps/com.moscatee.Editor.png
      - install -Dm644 flatpak/icons/com.moscatee.Editor-128x128.png /app/share/icons/hicolor/128x128/apps/com.moscatee.Editor.png
      - install -Dm644 flatpak/icons/com.moscatee.Editor-256x256.png /app/share/icons/hicolor/256x256/apps/com.moscatee.Editor.png
      - install -Dm644 flatpak/icons/com.moscatee.Editor-512x512.png /app/share/icons/hicolor/512x512/apps/com.moscatee.Editor.png
