app-id: com.moscatee.Editor
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20

command: moscatee

separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  # Accessibility / TTS: lets Chromium's Web Speech API reach the host's
  # speech-dispatcher daemon (used by the blind/low-vision mode).
  - --socket=session-bus
  - --talk-name=org.freedesktop.speechd
  - --filesystem=xdg-run/speech-dispatcher

build-options:
  append-path: /usr/lib/sdk/node20/bin
  build-args:
    - --share=network
  env:
    npm_config_nodedir: /usr/lib/sdk/node20
    npm_config_offline: 'true'
    npm_config_cache: /run/build/moscatee/flatpak-node/npm-cache

modules:
  - name: moscatee
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/Quiabbo/mosca-tee-editor.git
        tag: v0.1.22
        dest: src
      - ../generated-sources.json
      - type: script
        dest-filename: moscatee.sh
        commands:
          - exec zypak-wrapper.sh /app/main/node_modules/electron/dist/electron /app/main/main.cjs "$@"
    build-commands:
      # Install npm deps offline. --ignore-scripts skips postinstalls
      # (electron downloads its binary; sharp downloads libvips — neither
      # works in the network-less Flathub sandbox, so we handle them below).
      - cd src && npm ci --offline --ignore-scripts
      # Unpack the cached Electron binary into node_modules/electron/dist
      # (replaces what electron's install.js would have done online).
      - mkdir -p src/node_modules/electron/dist
      - cd src/node_modules/electron/dist && unzip -q /run/build/moscatee/flatpak-node/cache/electron/electron-v32.3.3-linux-x64.zip
      - chmod +x src/node_modules/electron/dist/electron
      - echo "electron" > src/node_modules/electron/path.txt
      # Build the renderer (Vite).
      - cd src && npm run build:electron
      # Install the app
      - mkdir -p /app/main
      - cp -a src/dist-web src/main.cjs src/preload.cjs src/package.json src/node_modules /app/main/
      - install -Dm755 moscatee.sh /app/bin/moscatee
      - install -Dm644 src/flatpak/com.moscatee.Editor.desktop /app/share/applications/com.moscatee.Editor.desktop
      - install -Dm644 src/flatpak/com.moscatee.Editor.metainfo.xml /app/share/metainfo/com.moscatee.Editor.metainfo.xml
      - install -Dm644 src/flatpak/icons/com.moscatee.Editor-48x48.png /app/share/icons/hicolor/48x48/apps/com.moscatee.Editor.png
      - install -Dm644 src/flatpak/icons/com.moscatee.Editor-128x128.png /app/share/icons/hicolor/128x128/apps/com.moscatee.Editor.png
      - install -Dm644 src/flatpak/icons/com.moscatee.Editor-256x256.png /app/share/icons/hicolor/256x256/apps/com.moscatee.Editor.png
      - install -Dm644 src/flatpak/icons/com.moscatee.Editor-512x512.png /app/share/icons/hicolor/512x512/apps/com.moscatee.Editor.png
