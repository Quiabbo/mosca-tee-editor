name: Release build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Build Electron (linux dir)
        run: npm run electron-build

      - name: Archive linux-unpacked
        if: success()
        run: |
          mkdir -p release-artifacts
          if [ -d dist/linux-unpacked ]; then
            cd dist/linux-unpacked
            tar -czf ../../release-artifacts/mosca-tee-linux.tar.gz .
            cd -
          else
            echo "dist/linux-unpacked not found" && exit 1
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosca-tee-linux
          path: release-artifacts/mosca-tee-linux.tar.gz
